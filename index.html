<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Sistema de Aprovação</title>
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="div-main">
        <header>
            <h1>Descubra sua Nota</h1>
            <p class="p-main">Insira as informações necessárias e descubra o resultado!
                Lembre-se de revisar as informações.</p>
        </header>

        <form>
            <label for="nome">Nome:</label>
            <input type="text" placeholder="Digite seu nome..." id="nome" class="input-name">
            <label for="email">Email:</label>
            <input type="email" placeholder="Digite seu melhor email..." id="email" class="input-email">
            <label for="instituicao">Instituição:</label>
            <input type="text" placeholder="Instituição da prova..." id="instituicao" class="input-inst">
            <label for="disciplina">Disciplina:</label>
            <select name="disciplina" id="disciplina">
                <option value="">Selecione uma disciplina</option>
                <option value="Matematica">Matemática</option>
                <option value="Portugues">Português</option>
                <option value="Historia">História</option>
                <option value="Geografia">Geografia</option>
                <option value="Fisica">Física</option>
                <option value="Quimica">Quí­mica</option>
                <option value="Biologia">Biologia</option>
                <option value="Ingles">Inglês</option>
                <option value="Espanhol">Espanhol</option>
                <option value="Filosofia">Filosofia</option>
                <option value="Sociologia">Sociologia</option>
                <option value="Arte">Arte</option>
                <option value="Educacao-fisica">Educação Fí­sica</option>
                <option value="Informatica">Informática</option>
                <option value="Economia">Economia</option>
            </select>

            <label for="nota">Nota</label>
            <input type="number" id="nota" min="0" max="10" class="input-nota">

            <button type="button">Enviar</button>
        </form>
        <div class="div-aviso">
            <p class="p-div"></p>
        </div>
    </div>
</body>

</html>
